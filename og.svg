<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#faf7f2"/>
  <rect x="0" y="0" width="1200" height="10" fill="#1f6b4f"/>

  <!-- brand mark -->
  <g transform="translate(80,84)">
    <rect width="46" height="46" rx="10" fill="#1f6b4f"/>
    <path d="M23 11 v17 M23 28 l-7 -7 M23 28 l7 -7" fill="none" stroke="#faf7f2" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="32" font-size="25" letter-spacing="3" font-family="ui-monospace, 'Cascadia Code', Menlo, monospace" fill="#8a7f72" font-weight="600">REPORTS<tspan fill="#14110f">LOW</tspan></text>
  </g>

  <!-- eyebrow -->
  <text x="80" y="232" font-size="24" letter-spacing="5" font-family="ui-monospace, 'Cascadia Code', Menlo, monospace" fill="#1f6b4f" font-weight="600">STATEMENT DATE · NOT DUE DATE</text>

  <!-- headline -->
  <text x="78" y="318" font-size="74" font-weight="700" fill="#14110f" letter-spacing="-1.5">Know what your card</text>
  <text x="78" y="402" font-size="74" font-weight="700" letter-spacing="-1.5"><tspan fill="#14110f">actually </tspan><tspan fill="#1f6b4f">reports.</tspan></text>

  <!-- subtext -->
  <text x="80" y="470" font-size="29" fill="#4a443c">Pay down before your statement closes — not your due date —</text>
  <text x="80" y="508" font-size="29" fill="#4a443c">so your card reports a low balance to the credit bureaus.</text>

  <!-- utilization bar motif -->
  <g transform="translate(80,548)">
    <rect width="1040" height="14" rx="7" fill="#ded5c7"/>
    <rect width="190" height="14" rx="7" fill="#1f6b4f"/>
    <rect x="312" y="-5" width="3" height="24" fill="#14110f"/>
    <text x="320" y="11" font-size="15" font-family="ui-monospace, monospace" fill="#8a7f72">30% target</text>
  </g>
</svg>
